<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" width="160" height="100">
  <defs>
    <linearGradient id="degradado" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a5cf6"/>
      <stop offset="1" stop-color="#5ce1e6"/>
    </linearGradient>
  </defs>

  <!-- Fondo oscuro (color de la página) -->
  <rect width="160" height="100" fill="#0b0d1f"/>

  <!-- Sobre: translate lo mueve en vertical -->
  <g transform="translate(0 4)">
    <rect x="30" y="34" width="100" height="56" rx="6" fill="url(#degradado)"/>
    <path d="M30 40 L80 70 L130 40" fill="none" stroke="#f2f0ff"
          stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- Estrella: scale cambia su tamaño -->
  <path d="M0 -12 L3 -3 L12 0 L3 3 L0 12 L-3 3 L-12 0 L-3 -3 Z"
        fill="#f2f0ff" transform="translate(132 20) scale(0.6)"/>
</svg>